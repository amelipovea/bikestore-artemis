spring.application.name=bikestore-artemis
server.port=8080

spring.profiles.default=integrated

spring.artemis.mode=native
spring.artemis.broker-url=tcp://127.0.0.1:61616
spring.artemis.user=${ARTEMIS_USER}
spring.artemis.password=${ARTEMIS_PASSWORD}

spring.jms.pub-sub-domain=false
spring.jms.listener.session.transacted=true